name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Buildozer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libbz2-dev libreadline-dev libssl-dev libsqlite3-dev libffi-dev libgmp-dev libltdl-dev libgomp1

      - name: Build with Buildozer
        run: |
          pip install buildozer cython virtualenv
          
          # РАДИКАЛЬНЫЙ ФИКС: Физически удаляем дефолтные NDK 27 и NDK 30 с сервера, 
          # чтобы у Buildozer не было шансов запустить несовместимый компилятор
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          
          # Полностью зануляем системные переменные путей во всех возможных форматах
          export ANDROID_NDK=""
          export ANDROID_NDK_HOME=""
          export ANDROID_NDK_ROOT=""
          export ANDROID_NDK_LATEST_HOME=""
          
          yes | buildozer android debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: bin/*.apk
